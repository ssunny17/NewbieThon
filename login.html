<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="global.css">
  <link rel="stylesheet" href="login.css">
</head>

<body>

<div class="login">

  <div class="rectangle"></div>

  <div class="group">
    <div class="text-wrapper">E-MAIL</div>

    <input
        type="email"
        id="email"
        class="login-input"
        placeholder="Enter Your Email"
    />
  </div>

<div class="group-2">
  <div class="text-wrapper">PASSWORD</div>

  <input
    type="password"
    id="password"
    class="login-input"
    placeholder="Enter Your Password"
  />
</div>

<button id="signInBtn" class="sign-in-button">
  SIGN IN
</button>

  <img class="LOG-IN" src="img/LOG IN.png" />

  <p class="don-t-have-an">
    <span class="span">Don’t have an account? </span>
    <span class="text-wrapper-5" id="signUpBtn">Sign Up!</span>
  </p>

</div>

<script src="login.js"></script>

</body>
</html>
